apply plugin: 'com.android.application'

android {
    namespace = 'com.primeprofast.app'
    compileSdk = 36
    ndkVersion = "29.0.13113456"

    sourceSets.main.assets.srcDir rootProject.file('shared')
    
    // Habilitar BuildConfig para campos customizados
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId = "com.primeprofast.app"
        minSdk = 24
        targetSdk = 36
        versionCode = 11
        versionName = "1.0.6"
        externalNativeBuild {
            cmake {
                cppFlags.addAll(['-O3', '-ffast-math', '-funroll-loops', '-DNDEBUG', '-fomit-frame-pointer'])
            }
        }
        ndk {
            abiFilters.add('arm64-v8a')
        }
    }
    packaging {
        jniLibs {
            // Preserve the native-library packaging used in the validated release.
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            // Carregar configurações do keystore de produção
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            } else {
                // Fallback para debug se keystore.properties não existir
                storeFile = file('debug.keystore')
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
    }
    
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            signingConfig = signingConfigs.release
            
            // Configurações de segurança
            buildConfigField("boolean", "DEBUG_MODE", "false")
            buildConfigField("String", "SECURITY_KEY", "\"PrimeProFast2024\"")
            
            // Otimizações para evitar timeout do AAPT2
            crunchPngs = false
        }
    }
    
    // Configurações para evitar timeout do AAPT2
    androidResources {
        noCompress.addAll(['png', 'jpg', 'jpeg'])
        ignoreAssetsPattern = "!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~"
    }
    
    // Desabilitar lint para release temporariamente
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
    externalNativeBuild {
        cmake {
            path = file("src/main/cpp/CMakeLists.txt")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.android.billingclient:billing:8.0.0'
}

// Billing/Activity puxam kotlin-stdlib-jdk7/8 antigos; no Kotlin 1.8+ essas classes
// já estão no kotlin-stdlib — forçar alinhamento evita Duplicate class no checkDuplicates.
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
